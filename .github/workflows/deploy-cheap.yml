name: Deploy Cheap (SAM)

# Low-cost stack: Lambda + API Gateway + DynamoDB + S3/CloudFront
# 1 API + 2 frontends: Options (public) and Futures (Basic Auth).
# No NAT Gateway, no RDS, no App Runner.
# Retrigger staging for v46 (frontend Options build step failed on first run).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
        default: staging
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/sam/**"
      - "infra/aws/**"
      - ".github/workflows/deploy-cheap.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'maite-trading' }}

jobs:
  deploy:
    name: Deploy cheap (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
      STACK_NAME: ${{ format('{0}-cheap-{1}', vars.PROJECT_NAME || 'maite-trading', github.event.inputs.environment || 'staging') }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::289981265319:role/maite-trading-github-actions
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: SAM build
        working-directory: infra/sam
        run: sam build --template template.yaml

      - name: SAM deploy
        working-directory: infra/sam
        env:
          OPTIONS_AUTH_USER: ${{ secrets.OPTIONS_BASIC_AUTH_USER || 'maite' }}
          OPTIONS_AUTH_PASSWORD: ${{ secrets.OPTIONS_BASIC_AUTH_PASSWORD || 'maite-options' }}
          FUTURES_AUTH_USER: ${{ secrets.FUTURES_BASIC_AUTH_USER || 'maite' }}
          FUTURES_AUTH_PASSWORD: ${{ secrets.FUTURES_BASIC_AUTH_PASSWORD || 'maite-futures' }}
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "EnvironmentName=${ENVIRONMENT}" \
              "OptionsAuthUser=${OPTIONS_AUTH_USER}" \
              "OptionsAuthPassword=${OPTIONS_AUTH_PASSWORD}" \
              "FuturesAuthUser=${FUTURES_AUTH_USER}" \
              "FuturesAuthPassword=${FUTURES_AUTH_PASSWORD}" \
            --region "$AWS_REGION"

      - name: Read stack outputs
        id: out
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='WebBucketName'].OutputValue" --output text)
          CF_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          CF_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" --output text)
          F_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='FuturesWebBucketName'].OutputValue" --output text)
          F_CF_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='FuturesCloudFrontDistributionId'].OutputValue" --output text)
          F_CF_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='FuturesCloudFrontUrl'].OutputValue" --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "cf_id=$CF_ID" >> "$GITHUB_OUTPUT"
          echo "cf_url=$CF_URL" >> "$GITHUB_OUTPUT"
          echo "futures_bucket=$F_BUCKET" >> "$GITHUB_OUTPUT"
          echo "futures_cf_id=$F_CF_ID" >> "$GITHUB_OUTPUT"
          echo "futures_cf_url=$F_CF_URL" >> "$GITHUB_OUTPUT"
          echo "API_URL=$API_URL"
          echo "Options CloudFront=$CF_URL"
          echo "Futures CloudFront=$F_CF_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build + sync Options frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.out.outputs.api_url }}
          NEXT_PUBLIC_APP_MODE: options
          NEXT_PUBLIC_OPTIONS_APP_URL: ${{ steps.out.outputs.cf_url }}
          NEXT_PUBLIC_FUTURES_APP_URL: ${{ steps.out.outputs.futures_cf_url }}
        run: |
          npm run build
          aws s3 sync out/ "s3://${{ steps.out.outputs.bucket }}/" --delete \
            --cache-control "max-age=0, no-cache, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.out.outputs.cf_id }}" \
            --paths "/*"

      - name: Build + sync Futures frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.out.outputs.api_url }}
          NEXT_PUBLIC_APP_MODE: futures
          NEXT_PUBLIC_OPTIONS_APP_URL: ${{ steps.out.outputs.cf_url }}
          NEXT_PUBLIC_FUTURES_APP_URL: ${{ steps.out.outputs.futures_cf_url }}
        run: |
          rm -rf out .next
          npm run build
          aws s3 sync out/ "s3://${{ steps.out.outputs.futures_bucket }}/" --delete \
            --cache-control "max-age=0, no-cache, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.out.outputs.futures_cf_id }}" \
            --paths "/*"

      - name: Summary
        run: |
          echo "### Cheap stack deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.out.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Options UI (public): ${{ steps.out.outputs.cf_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Futures UI (Basic Auth): ${{ steps.out.outputs.futures_cf_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- No NAT / RDS / App Runner" >> "$GITHUB_STEP_SUMMARY"
