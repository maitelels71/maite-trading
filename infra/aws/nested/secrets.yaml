AWSTemplateFormatVersion: "2010-09-09"
Description: Secrets Manager secrets for DB and provider credentials

Parameters:
  EnvironmentName:
    Type: String
  DbUsername:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true

Resources:
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub maite/${EnvironmentName}/db
      Description: RDS credentials for Maite Trading
      SecretString: !Sub |
        {
          "username": "${DbUsername}",
          "password": "${DbPassword}",
          "dbname": "maite"
        }

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub maite/${EnvironmentName}/app
      Description: Provider credentials and app secrets (fill after deploy)
      SecretString: !Sub |
        {
          "SCHWAB_CLIENT_ID": "",
          "SCHWAB_CLIENT_SECRET": "",
          "SCHWAB_REFRESH_TOKEN": "",
          "TRADEADVOCATE_API_KEY": "",
          "USE_MOCK_PROVIDERS": "true"
        }

Outputs:
  DbSecretArn:
    Value: !Ref DbSecret
  AppSecretArn:
    Value: !Ref AppSecret
