AWSTemplateFormatVersion: "2010-09-09"
Description: Secrets Manager placeholders for broker credentials (Schwab + TradeAdvocate)

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String

Resources:
  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/${EnvironmentName}/app"
      Description: Broker API credentials and app config (fill values after deploy)
      SecretString: !Sub |
        {
          "SCHWAB_CLIENT_ID": "",
          "SCHWAB_CLIENT_SECRET": "",
          "SCHWAB_REDIRECT_URI": "https://127.0.0.1:8182",
          "TRADEADVOCATE_API_KEY": "",
          "TRADEADVOCATE_API_SECRET": "",
          "TRADEADVOCATE_BASE_URL": "",
          "TRADEADVOCATE_ACCOUNT_ID": "",
          "DEFAULT_TIMEZONE": "America/New_York",
          "CORS_ORIGINS": "*"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  AppSecretsArn:
    Value: !Ref AppSecrets
  AppSecretsName:
    Value: !Sub "${ProjectName}/${EnvironmentName}/app"
