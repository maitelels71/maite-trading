AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Maite Trading — low-cost serverless stack.
  API Gateway HTTP API + Lambda + DynamoDB + S3/CloudFront.
  No NAT Gateway, no RDS, no App Runner.

Parameters:
  ProjectName:
    Type: String
    Default: maite-trading
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  CorsOrigins:
    Type: String
    Default: "*"
  OptionsAuthUser:
    Type: String
    Default: maite
    Description: Basic-auth username for the private Options CloudFront UI
  OptionsAuthPassword:
    Type: String
    NoEcho: true
    Default: "maite-options"
    Description: >
      Basic-auth password for Options UI. Override via SAM parameter /
      GitHub secret OPTIONS_BASIC_AUTH_PASSWORD. Change after first deploy.
  FuturesAuthUser:
    Type: String
    Default: maite
    Description: Basic-auth username for the private Futures CloudFront UI
  FuturesAuthPassword:
    Type: String
    NoEcho: true
    Default: "maite-futures"
    Description: >
      Basic-auth password for Futures UI. Override via SAM parameter /
      GitHub secret FUTURES_BASIC_AUTH_PASSWORD. Change after first deploy.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 1024
    Architectures: [x86_64]
    Environment:
      Variables:
        ENVIRONMENT: !Ref EnvironmentName
        STORAGE_BACKEND: dynamodb
        TABLE_INSTRUMENTS: !Ref InstrumentsTable
        TABLE_CANDLES: !Ref CandlesTable
        TABLE_STRATEGIES: !Ref StrategiesTable
        TABLE_BACKTEST_RUNS: !Ref BacktestRunsTable
        TABLE_TRADES: !Ref TradesTable
        APP_SECRETS_ARN: !Ref AppSecrets
        CORS_ORIGINS: !Ref CorsOrigins
        DEFAULT_TIMEZONE: America/New_York
        # Resolved at deploy from Secrets Manager (required for News on staging)
        FINNHUB_API_KEY: !Sub "{{resolve:secretsmanager:${AppSecrets}:SecretString:FINNHUB_API_KEY}}"

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref EnvironmentName
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-api"
      CodeUri: ../../backend/
      Handler: app.lambda_handler.handler
      Description: FastAPI (Mangum) trading research API
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InstrumentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CandlesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StrategiesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BacktestRunsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TradesTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
              Resource: !Ref AppSecrets
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
    Metadata:
      BuildMethod: python3.12

  InstrumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-instruments"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  CandlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-candles"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  StrategiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-strategies"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  BacktestRunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-backtest-runs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  TradesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-trades"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  AppSecrets:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/${EnvironmentName}/app"
      Description: >
        Broker credentials (Schwab / TradeAdvocate / Finnhub).
        Values are managed out-of-band (Admin Publish / restore_staging_secrets).
        Do not put placeholder SecretString here — CloudFormation would overwrite live secrets on deploy.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${EnvironmentName}-web-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  OptionsAuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-options-auth"
      AutoPublish: true
      FunctionConfig:
        Comment: HTTP Basic Auth gate for Options UI
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var request = event.request;
            var headers = request.headers;
            var expected = 'Basic ${AuthToken}';
            if (
              typeof headers.authorization === 'undefined' ||
              headers.authorization.value !== expected
            ) {
              return {
                statusCode: 401,
                statusDescription: 'Unauthorized',
                headers: {
                  'www-authenticate': { value: 'Basic realm="Trading Like a Boss Options"' }
                }
              };
            }
            return request;
          }
        - AuthToken:
            Fn::Base64: !Sub "${OptionsAuthUser}:${OptionsAuthPassword}"

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} ${EnvironmentName} Options UI (Basic Auth)"
        DefaultRootObject: index.html
        Origins:
          - Id: webS3
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: webS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt OptionsAuthFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100

  # --- Futures UI (private): separate bucket + CloudFront + Basic Auth ---

  FuturesWebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${EnvironmentName}-web-futures-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FuturesWebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FuturesWebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadFutures
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FuturesWebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FuturesWebDistribution}"

  FuturesWebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-futures-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FuturesAuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-futures-auth"
      AutoPublish: true
      FunctionConfig:
        Comment: HTTP Basic Auth gate for Futures UI
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var request = event.request;
            var headers = request.headers;
            var expected = 'Basic ${AuthToken}';
            if (
              typeof headers.authorization === 'undefined' ||
              headers.authorization.value !== expected
            ) {
              return {
                statusCode: 401,
                statusDescription: 'Unauthorized',
                headers: {
                  'www-authenticate': { value: 'Basic realm="Trading Like a Boss Futures"' }
                }
              };
            }
            return request;
          }
        - AuthToken:
            Fn::Base64: !Sub "${FuturesAuthUser}:${FuturesAuthPassword}"

  FuturesWebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} ${EnvironmentName} Futures UI (private Basic Auth)"
        DefaultRootObject: index.html
        Origins:
          - Id: futuresWebS3
            DomainName: !GetAtt FuturesWebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FuturesWebOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: futuresWebS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FuturesAuthFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100

Outputs:
  ApiUrl:
    Description: HTTP API base URL (append paths like /health)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}"
  WebBucketName:
    Description: S3 bucket for Options frontend (Basic Auth)
    Value: !Ref WebBucket
  CloudFrontUrl:
    Description: Options frontend URL (Basic Auth required)
    Value: !Sub "https://${WebDistribution.DomainName}"
  CloudFrontDistributionId:
    Value: !Ref WebDistribution
  FuturesWebBucketName:
    Description: S3 bucket for Futures frontend (private)
    Value: !Ref FuturesWebBucket
  FuturesCloudFrontUrl:
    Description: Futures frontend URL (Basic Auth required)
    Value: !Sub "https://${FuturesWebDistribution.DomainName}"
  FuturesCloudFrontDistributionId:
    Value: !Ref FuturesWebDistribution
  AppSecretsArn:
    Value: !Ref AppSecrets
  StackMode:
    Value: cheap-serverless
    Description: No NAT / RDS / App Runner
